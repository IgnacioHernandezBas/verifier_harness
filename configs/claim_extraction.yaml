# Claim Extraction Configuration

# LLM Configuration
model_name: "meta-llama/Meta-Llama-3-8B-Instruct"
model_endpoint: "http://localhost:8000"
temperature: 0.7
max_tokens: 2048

# Prompt Configuration
prompt_template: "claim_prompt_v2_1.jinja"

# Pipeline Configuration
skip_eligibility: false
enable_grounding: true
enable_evidence_extraction: true

# Scoring Thresholds
min_specificity_score: 0.5
min_evidence_score: 0.6
min_overall_score: 0.7

# Output Configuration
output_format: "json"
include_metadata: true

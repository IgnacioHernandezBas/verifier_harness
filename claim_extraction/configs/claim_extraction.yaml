llm:
  backend: vllm
  endpoint: http://127.0.0.1:8000/v1
  model: Qwen/Qwen2.5-Coder-32B-Instruct-AWQ
  temperature: 0.1
  max_tokens: 2048
  timeout_s: 120

extraction:
  min_claim_score: 2
  check_eligibility: true
  require_grounding: true
  max_claims_per_issue: 6

context:
  max_chars: 22000

parsing:
  allow_repair: true

eligibility:
  threshold: 2

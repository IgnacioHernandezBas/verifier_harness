schema_version: "2.2"
prompt_template: claim_prompt_v2_2.jinja

llm:
  backend: vllm
  endpoint: http://127.0.0.1:8000/v1
  model: hugging-quants/Meta-Llama-3.1-70B-Instruct-AWQ-INT4
  temperature: 0.0
  max_tokens: 2048
  timeout_s: 120

extraction:
  min_claim_score: 2
  check_eligibility: true
  require_grounding: true
  max_claims_per_issue: 6

context:
  max_chars: 22000

parsing:
  allow_repair: true

eligibility:
  threshold: 2
